<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0d1a"/>
      <stop offset="50%" stop-color="#151226"/>
      <stop offset="100%" stop-color="#0d0a17"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1a33"/>
      <stop offset="100%" stop-color="#141124"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1200" height="60" fill="#131022" opacity="0.95"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#2c2647" stroke-width="1"/>
  
  <!-- Logo -->
  <rect x="50" y="16" width="28" height="28" rx="8" fill="url(#purpleGrad)"/>
  <path d="M58 30 L64 36 L72 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="90" y="35" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">BOT-SYNC // AUTOMATION</text>
  
  <rect x="980" y="14" width="170" height="32" rx="16" fill="#241e3d"/>
  <circle cx="1000" cy="30" r="4" fill="#10b981"/>
  <text x="1015" y="35" fill="#a78bfa" font-family="monospace" font-size="12">TELEGRAM WEBHOOK: OK</text>

  <!-- Left Sidebar (Telegram Chat Simulator) -->
  <rect x="50" y="85" width="340" height="540" rx="16" fill="url(#cardGrad)" stroke="#2c2647" stroke-width="1"/>
  <text x="75" y="125" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Telegram WebApp</text>
  <text x="75" y="145" fill="#8b82aa" font-family="-apple-system, sans-serif" font-size="12">Демо-интерфейс бота заказов</text>

  <!-- Bot Chat Messages -->
  <rect x="75" y="170" width="250" height="48" rx="12" fill="#241e3d"/>
  <text x="90" y="192" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13">Здравствуйте! Выберите</text>
  <text x="90" y="208" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13">услугу из каталога ниже 👇</text>

  <rect x="135" y="230" width="230" height="36" rx="12" fill="#6366f1"/>
  <text x="150" y="253" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Заказать выезд мастера</text>

  <!-- Interactive Inline Buttons -->
  <rect x="75" y="280" width="290" height="42" rx="10" fill="#241e3d" stroke="#6366f1" stroke-width="1"/>
  <text x="130" y="306" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">⚡ Экспресс-диагностика</text>

  <rect x="75" y="332" width="290" height="42" rx="10" fill="#241e3d" stroke="#2c2647" stroke-width="1"/>
  <text x="145" y="358" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">📅 Плановое ТО оборудования</text>

  <!-- Input Field -->
  <rect x="75" y="555" width="290" height="46" rx="23" fill="#1b172e" stroke="#2c2647" stroke-width="1"/>
  <text x="95" y="583" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Введите номер телефона...</text>
  <circle cx="340" cy="578" r="16" fill="url(#purpleGrad)"/>
  <path d="M336 578 L344 574 L340 582 Z" fill="#ffffff"/>

  <!-- Right Dashboard Area -->
  <rect x="415" y="85" width="735" height="540" rx="16" fill="url(#cardGrad)" stroke="#2c2647" stroke-width="1"/>
  
  <text x="445" y="125" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Панель управления заказами</text>
  <text x="445" y="148" fill="#8b82aa" font-family="-apple-system, sans-serif" font-size="13">Синхронизация MySQL сайта и очереди заявок в реальном времени</text>

  <!-- Stat Cards -->
  <g transform="translate(445, 175)">
    <!-- Card 1 -->
    <rect width="215" height="90" rx="12" fill="#1b172e" stroke="#2c2647" stroke-width="1"/>
    <text x="18" y="32" fill="#8b82aa" font-family="monospace" font-size="11">ЗАКАЗОВ СЕГОДНЯ</text>
    <text x="18" y="65" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="26" font-weight="700">142</text>
    <text x="80" y="65" fill="#10b981" font-family="monospace" font-size="12">+28% vs вчера</text>

    <!-- Card 2 -->
    <rect x="235" width="215" height="90" rx="12" fill="#1b172e" stroke="#2c2647" stroke-width="1"/>
    <text x="253" y="32" fill="#8b82aa" font-family="monospace" font-size="11">ВРЕМЯ ОТВЕТА БОТА</text>
    <text x="253" y="65" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="26" font-weight="700">0.2s</text>
    <text x="325" y="65" fill="#8b82aa" font-family="monospace" font-size="12">Webhook API</text>

    <!-- Card 3 -->
    <rect x="470" width="215" height="90" rx="12" fill="#1b172e" stroke="#2c2647" stroke-width="1"/>
    <text x="488" y="32" fill="#8b82aa" font-family="monospace" font-size="11">ДОСТАВКА В CRM</text>
    <text x="488" y="65" fill="#10b981" font-family="-apple-system, sans-serif" font-size="26" font-weight="700">100%</text>
    <text x="565" y="65" fill="#10b981" font-family="monospace" font-size="12">0 потерь</text>
  </g>

  <!-- Live Orders Table Simulator -->
  <g transform="translate(445, 290)">
    <rect width="685" height="305" rx="12" fill="#171329" stroke="#2c2647" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect width="685" height="42" rx="12" fill="#1b1630"/>
    <text x="25" y="26" fill="#8b82aa" font-family="monospace" font-size="11">ID</text>
    <text x="90" y="26" fill="#8b82aa" font-family="monospace" font-size="11">КЛИЕНТ</text>
    <text x="240" y="26" fill="#8b82aa" font-family="monospace" font-size="11">УСЛУГА</text>
    <text x="450" y="26" fill="#8b82aa" font-family="monospace" font-size="11">СТАТУС</text>
    <text x="580" y="26" fill="#8b82aa" font-family="monospace" font-size="11">СУММА</text>

    <!-- Row 1 -->
    <line x1="0" y1="95" x2="685" y2="95" stroke="#241e3d"/>
    <text x="25" y="75" fill="#c084fc" font-family="monospace" font-size="12">#4921</text>
    <text x="90" y="75" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13">@alex_smirnov</text>
    <text x="240" y="75" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">Экспресс-диагностика ЧПУ</text>
    <rect x="450" y="60" width="90" height="22" rx="11" fill="#10b981" opacity="0.2"/>
    <text x="465" y="75" fill="#34d399" font-family="monospace" font-size="11">ПРИНЯТ</text>
    <text x="580" y="75" fill="#ffffff" font-family="monospace" font-size="13" font-weight="600">8 500 ₽</text>

    <!-- Row 2 -->
    <line x1="0" y1="150" x2="685" y2="150" stroke="#241e3d"/>
    <text x="25" y="130" fill="#c084fc" font-family="monospace" font-size="12">#4920</text>
    <text x="90" y="130" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13">+7 (926) ***-44-12</text>
    <text x="240" y="130" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">Плановое ТО автопарка</text>
    <rect x="450" y="115" width="90" height="22" rx="11" fill="#6366f1" opacity="0.2"/>
    <text x="462" y="130" fill="#818cf8" font-family="monospace" font-size="11">В РАБОТЕ</text>
    <text x="580" y="130" fill="#ffffff" font-family="monospace" font-size="13" font-weight="600">34 000 ₽</text>

    <!-- Row 3 -->
    <line x1="0" y1="205" x2="685" y2="205" stroke="#241e3d"/>
    <text x="25" y="185" fill="#c084fc" font-family="monospace" font-size="12">#4919</text>
    <text x="90" y="185" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13">@dmitry_v</text>
    <text x="240" y="185" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">Срочный вызов инженера</text>
    <rect x="450" y="170" width="90" height="22" rx="11" fill="#10b981" opacity="0.2"/>
    <text x="465" y="185" fill="#34d399" font-family="monospace" font-size="11">ВЫПОЛНЕН</text>
    <text x="580" y="185" fill="#ffffff" font-family="monospace" font-size="13" font-weight="600">12 000 ₽</text>
  </g>
</svg>
