<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="optBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="emeraldGauge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131c2e"/>
      <stop offset="100%" stop-color="#0d1422"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#optBg)"/>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#0d1422" opacity="0.95"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Logo -->
  <circle cx="65" cy="30" r="14" fill="#10b981" opacity="0.2"/>
  <circle cx="65" cy="30" r="6" fill="#10b981"/>
  <text x="92" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">CORE WEB VITALS // AUDIT</text>
  
  <rect x="940" y="14" width="210" height="32" rx="16" fill="#1e293b"/>
  <circle cx="960" cy="30" r="4" fill="#10b981"/>
  <text x="975" y="35" fill="#38bdf8" font-family="monospace" font-size="12">STATUS: GREEN ZONE 98+</text>

  <!-- Left Column: Google Lighthouse Scores -->
  <rect x="50" y="85" width="480" height="540" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="125" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Google Lighthouse Score</text>
  <text x="80" y="148" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Результаты оптимизации каталога (до / после)</text>

  <!-- Circular Gauges -->
  <g transform="translate(80, 180)">
    <!-- Gauge 1: Performance -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="#1e293b" stroke-width="8"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="10" stroke-linecap="round"/>
    <text x="50" y="56" fill="#10b981" font-family="monospace" font-size="22" font-weight="700" text-anchor="middle">98</text>
    <text x="50" y="112" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Performance</text>
    <text x="50" y="128" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">(было 32)</text>

    <!-- Gauge 2: Accessibility -->
    <circle cx="160" cy="50" r="42" fill="none" stroke="#1e293b" stroke-width="8"/>
    <circle cx="160" cy="50" r="42" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="14" stroke-linecap="round"/>
    <text x="160" y="56" fill="#10b981" font-family="monospace" font-size="22" font-weight="700" text-anchor="middle">96</text>
    <text x="160" y="112" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Accessibility</text>
    <text x="160" y="128" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">100% compliant</text>

    <!-- Gauge 3: Best Practices -->
    <circle cx="270" cy="50" r="42" fill="none" stroke="#1e293b" stroke-width="8"/>
    <circle cx="270" cy="50" r="42" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="0" stroke-linecap="round"/>
    <text x="270" y="56" fill="#10b981" font-family="monospace" font-size="22" font-weight="700" text-anchor="middle">100</text>
    <text x="270" y="112" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Best Practices</text>
    <text x="270" y="128" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Nginx / SSL</text>

    <!-- Gauge 4: SEO -->
    <circle cx="380" cy="50" r="42" fill="none" stroke="#1e293b" stroke-width="8"/>
    <circle cx="380" cy="50" r="42" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="5" stroke-linecap="round"/>
    <text x="380" y="56" fill="#10b981" font-family="monospace" font-size="22" font-weight="700" text-anchor="middle">99</text>
    <text x="380" y="112" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SEO Score</text>
    <text x="380" y="128" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Schema.org</text>
  </g>

  <!-- Metric Bars -->
  <g transform="translate(80, 340)">
    <text x="0" y="15" fill="#cbd5e1" font-family="monospace" font-size="12">FIRST CONTENTFUL PAINT (FCP)</text>
    <text x="390" y="15" fill="#10b981" font-family="monospace" font-size="12" text-anchor="end">0.4s (Good)</text>
    <rect y="25" width="420" height="8" rx="4" fill="#1e293b"/>
    <rect y="25" width="400" height="8" rx="4" fill="#10b981"/>

    <text x="0" y="70" fill="#cbd5e1" font-family="monospace" font-size="12">LARGEST CONTENTFUL PAINT (LCP)</text>
    <text x="390" y="70" fill="#10b981" font-family="monospace" font-size="12" text-anchor="end">0.8s (Было 4.6s)</text>
    <rect y="80" width="420" height="8" rx="4" fill="#1e293b"/>
    <rect y="80" width="380" height="8" rx="4" fill="#10b981"/>

    <text x="0" y="125" fill="#cbd5e1" font-family="monospace" font-size="12">CUMULATIVE LAYOUT SHIFT (CLS)</text>
    <text x="390" y="125" fill="#10b981" font-family="monospace" font-size="12" text-anchor="end">0.001 (Zero Shift)</text>
    <rect y="135" width="420" height="8" rx="4" fill="#1e293b"/>
    <rect y="135" width="418" height="8" rx="4" fill="#10b981"/>

    <text x="0" y="180" fill="#cbd5e1" font-family="monospace" font-size="12">TOTAL BLOCKING TIME (TBT)</text>
    <text x="390" y="180" fill="#10b981" font-family="monospace" font-size="12" text-anchor="end">20ms</text>
    <rect y="190" width="420" height="8" rx="4" fill="#1e293b"/>
    <rect y="190" width="395" height="8" rx="4" fill="#10b981"/>
  </g>

  <!-- Right Column: Optimized Online Store Catalog Preview -->
  <rect x="555" y="85" width="595" height="540" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
  
  <text x="585" y="125" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Оптимизированный каталог товаров</text>
  <text x="585" y="148" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Автоконвертация WebP, ленивая загрузка, сжатие ассетов на 83%</text>

  <!-- Product Cards Grid -->
  <g transform="translate(585, 180)">
    <!-- Product 1 -->
    <rect width="165" height="195" rx="12" fill="#0d1422" stroke="#1e293b" stroke-width="1"/>
    <rect x="15" y="15" width="135" height="90" rx="8" fill="#1a253a"/>
    <circle cx="82" cy="60" r="22" fill="#38bdf8" opacity="0.3"/>
    <rect x="15" y="115" width="90" height="12" rx="6" fill="#334155"/>
    <text x="15" y="145" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">12 400 ₽</text>
    <rect x="15" y="155" width="135" height="26" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="82" y="172" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">В корзину (0.1s)</text>

    <!-- Product 2 -->
    <rect x="185" width="165" height="195" rx="12" fill="#0d1422" stroke="#1e293b" stroke-width="1"/>
    <rect x="200" y="15" width="135" height="90" rx="8" fill="#1a253a"/>
    <circle cx="267" cy="60" r="22" fill="#a855f7" opacity="0.3"/>
    <rect x="200" y="115" width="90" height="12" rx="6" fill="#334155"/>
    <text x="200" y="145" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">8 990 ₽</text>
    <rect x="200" y="155" width="135" height="26" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="267" y="172" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">В корзину (0.1s)</text>

    <!-- Product 3 -->
    <rect x="370" width="165" height="195" rx="12" fill="#0d1422" stroke="#1e293b" stroke-width="1"/>
    <rect x="385" y="15" width="135" height="90" rx="8" fill="#1a253a"/>
    <circle cx="452" cy="60" r="22" fill="#f59e0b" opacity="0.3"/>
    <rect x="385" y="115" width="90" height="12" rx="6" fill="#334155"/>
    <text x="385" y="145" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">24 500 ₽</text>
    <rect x="385" y="155" width="135" height="26" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="452" y="172" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">В корзину (0.1s)</text>
  </g>

  <!-- Bottom Speed Summary Banner -->
  <g transform="translate(585, 400)">
    <rect width="535" height="195" rx="12" fill="#0d1422" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="35" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Эффект оптимизации для клиента</text>
    
    <g transform="translate(25, 60)">
      <rect width="145" height="65" rx="8" fill="#152033"/>
      <text x="15" y="24" fill="#94a3b8" font-family="monospace" font-size="10">ОТКАЗЫ ПОЛЬЗОВАТЕЛЕЙ</text>
      <text x="15" y="50" fill="#10b981" font-family="monospace" font-size="20" font-weight="700">-34%</text>

      <rect x="165" width="155" height="65" rx="8" fill="#152033"/>
      <text x="180" y="24" fill="#94a3b8" font-family="monospace" font-size="10">ВЕС СТРАНИЦЫ</text>
      <text x="180" y="50" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="700">1.1 MB <tspan font-size="12" fill="#94a3b8">(было 6.4)</tspan></text>

      <rect x="340" width="145" height="65" rx="8" fill="#152033"/>
      <text x="355" y="24" fill="#94a3b8" font-family="monospace" font-size="10">ПОИСКОВЫЙ ТРАФИК</text>
      <text x="355" y="50" fill="#10b981" font-family="monospace" font-size="20" font-weight="700">+22%</text>
    </g>

    <text x="25" y="165" fill="#64748b" font-family="monospace" font-size="11">✓ Server-side Brotli  ✓ AVIF/WebP srcset  ✓ Critical CSS Inline  ✓ Redis Cache</text>
  </g>
</svg>
